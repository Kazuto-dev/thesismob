name: thesismob
description: "BuildQuantify: construction material quantity and cost estimator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  google_nav_bar: ^5.0.6
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/allen.png"

flutter:
  uses-material-design: true

  assets:
    # Legacy screens; removed with them.
    - lib/assets/logos/
    - lib/assets/images/
    - lib/assets/inspic/
    - assets/images/brand/
    - assets/images/categories/
    - assets/images/materials/
    - assets/images/help/
    - assets/fonts/poppins/OFL.txt

  # Subset to Latin; the peso sign falls back to the bundled Roboto.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
