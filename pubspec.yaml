name: thesismob
description: "BuildQuantify: construction material quantity and cost estimator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  go_router: ^18.0.2
  url_launcher: ^6.3.3
  material_ui: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/launcher/allen.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/brand/
    - assets/images/categories/
    - assets/images/materials/
    - assets/images/help/
    - assets/fonts/jakarta/OFL.txt

  # Subset to Latin plus ₱, ×, ², ½ and arrows; keeps tabular figures (tnum).
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/jakarta/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/jakarta/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/jakarta/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/jakarta/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/jakarta/PlusJakartaSans-ExtraBold.ttf
          weight: 800
