<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BuildQuantify estimates the quantity and cost of construction materials: blocks, plywood, paint, tiles, roofing, electrical and plumbing fixtures.">
  <meta name="theme-color" content="#F59E0B">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BuildQuantify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>BuildQuantify</title>

  <style>
    html, body { margin: 0; height: 100%; background: #FFFBF5; }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      font: 600 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3B2A0E;
      transition: opacity 200ms ease-out;
    }
    #loader .spinner {
      width: 44px; height: 44px; border-radius: 50%;
      border: 4px solid #FDE7B5; border-top-color: #B45309;
      animation: spin 900ms linear infinite;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loader .spinner { animation-duration: 2400ms; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <span>Loading BuildQuantify…</span>
  </div>
  <noscript>BuildQuantify needs JavaScript enabled to run.</noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 250);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
