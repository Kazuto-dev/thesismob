# BuildQuantify on one server: the database, the backend (the API) and
# the frontend (nginx serving the web app and passing /api/ to the
# backend), with certbot keeping the HTTPS certificate renewed.
# Settings come from .env next to this file (see .env.example).
#
#   docker compose up -d --build        start, or rebuild after an update
#   docker compose logs -f backend      watch the API
#   docker compose exec backend admin   the admin tool: codes, accounts
#   ./deploy/get-certificate.sh         HTTPS, once the domain points here

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildquantify
      POSTGRES_USER: buildquantify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildquantify -d buildquantify"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the backend reaches the database.

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://buildquantify:${POSTGRES_PASSWORD}@db:5432/buildquantify
      PORT: "8080"
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_ID:-}
      # The app is served from the same address, so browsers need no
      # cross-origin permission; this is for a copy hosted elsewhere.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DOMAIN:-localhost}}
      APP_URL: ${APP_URL:-https://${DOMAIN:-localhost}}
    depends_on:
      db:
        condition: service_healthy
    # Not published either: nginx reaches it at backend:8080.

  frontend:
    build:
      context: .
      target: frontend
      args:
        API_URL: /api
        GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Tries to renew twice a day; Let's Encrypt renews when fewer than
    # 30 days are left, and nginx reloads every 6 hours to use it.
    entrypoint: >-
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  db-data:
  certbot-certs:
  certbot-webroot:
