# BuildQuantify's site on port 80: the web app, and the API under /api/.
# Cloudflare sits in front and gives visitors HTTPS.
#
# This folder is mounted into nginx as /etc/nginx/conf.d, so changes
# arrive with git pull; deploy/update.sh reloads nginx to apply them.

# Visitors' own addresses. Through Cloudflare every request comes from
# one of Cloudflare's addresses, with the visitor's in CF-Connecting-IP.
# The header is believed only from these addresses, so nobody can forge
# it to dodge the API's rate limits. The list is Cloudflare's
# (https://www.cloudflare.com/ips/); CI warns when it changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Docker's DNS, so nginx finds the backend again after it restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# How the visitor reached Cloudflare, which reports it in
# X-Forwarded-Proto; plain HTTP when nothing says otherwise.
map $http_x_forwarded_proto $visitor_scheme {
  https https;
  default $scheme;
}

# Strict-Transport-Security only for visitors on HTTPS.
map $visitor_scheme $hsts {
  https "max-age=31536000";
  default "";
}

# The app's files keep their names from one release to the next, so
# browsers and Cloudflare must check for a newer copy each time (a quick
# "not modified" when nothing changed). The API sets its own.
map $request_uri $cache_control {
  ~^/api/ "";
  default "no-cache";
}

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json
             application/wasm image/svg+xml font/ttf font/otf;

  # An empty value sends no header.
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security $hsts always;

  # The API. /api/v1/me reaches the backend as /v1/me. The visitor's
  # address replaces any X-Forwarded-For they sent, so rate limits cannot
  # be dodged by forging one.
  location /api/ {
    set $backend backend:8080;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $visitor_scheme;
    proxy_read_timeout 60s;
    # Set above for every response; without these they would be doubled.
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
  }

  # Everything else is a file of the app, or a page of it.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
