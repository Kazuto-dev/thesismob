# Security headers. nginx drops headers set at an outer level when a
# location adds its own, so every location that adds one includes this.
# $hsts is empty over plain HTTP, which sends no Strict-Transport-Security.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Strict-Transport-Security $hsts always;
