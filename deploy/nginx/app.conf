# What the site serves, over HTTP or HTTPS: the web app, and the API
# under /api/. Included by http.conf.template and https.conf.template.

root /usr/share/nginx/html;
index index.html;
server_tokens off;
client_max_body_size 5m;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json
           application/wasm image/svg+xml font/ttf font/otf;

include /etc/nginx/buildquantify/headers.conf;

# The API. /api/v1/me reaches the backend as /v1/me. The client's
# address replaces any X-Forwarded-For it sent, so rate limits cannot be
# dodged by forging one.
location /api/ {
  proxy_pass http://backend:8080/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Let's Encrypt checks the domain here when issuing a certificate.
location /.well-known/acme-challenge/ {
  root /var/www/certbot;
}

# The start page, the service worker and the loader must never be
# cached, so a new release reaches everyone on their next visit.
location ~ ^/(index\.html|sw\.js|flutter_bootstrap\.js|manifest\.json)$ {
  add_header Cache-Control "no-cache";
  include /etc/nginx/buildquantify/headers.conf;
}

# The renderer is versioned by the Flutter release: cache it for a week.
location /canvaskit/ {
  add_header Cache-Control "public, max-age=604800";
  include /etc/nginx/buildquantify/headers.conf;
}

# Everything else is a file of the app, or a page of it.
location / {
  try_files $uri $uri/ /index.html;
}
