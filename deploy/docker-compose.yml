# BuildQuantify's backend: the API, its database and Caddy in front for
# HTTPS. Settings come from .env next to this file (see .env.example).
#
#   docker compose up -d --build      start or update
#   docker compose logs -f api        watch the API
#   docker compose exec api admin     the admin tool (codes, accounts)

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildquantify
      POSTGRES_USER: buildquantify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildquantify -d buildquantify"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Never published: only the API reaches the database.

  api:
    build: ../server
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://buildquantify:${POSTGRES_PASSWORD}@db:5432/buildquantify
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/app:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
