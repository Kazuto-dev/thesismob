<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="BuildQuantify estimates the quantity and cost of construction materials: blocks, plywood, paint, tiles, roofing, electrical and plumbing fixtures.">
  <meta name="theme-color" content="#F6F4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12100E" media="(prefers-color-scheme: dark)">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BuildQuantify">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>BuildQuantify</title>

  <style>
    :root { color-scheme: light dark; --bg: #F6F4F0; --ink: #1C1917; --muted: #57534E; --track: #E4DED6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #12100E; --ink: #F5F5F4; --muted: #C8C2BA; --track: #34302C; }
    }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--muted);
      transition: opacity 200ms ease-out;
    }
    #loader .mark { width: 64px; height: 64px; border-radius: 14px; box-shadow: 0 10px 30px rgba(245, 158, 11, 0.35); }
    #loader .bar { width: 140px; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
    #loader .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 4px; background: #F59E0B;
      animation: slide 1100ms ease-in-out infinite;
    }
    #loader.done { opacity: 0; pointer-events: none; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #loader .bar::after { animation-duration: 3000ms; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <img class="mark" src="icons/mark-64.png" alt="" aria-hidden="true">
    <div class="bar" aria-hidden="true"></div>
    <span>Loading BuildQuantify…</span>
  </div>
  <noscript>BuildQuantify needs JavaScript enabled to run.</noscript>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      loader.classList.add('done');
      setTimeout(function () { loader.remove(); }, 250);
    });
  </script>
  <script>
    // Offline support. Skipped on local development servers unless the URL
    // has ?offline, so debug builds are never served from the cache.
    if ('serviceWorker' in navigator &&
        (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ||
         location.search.indexOf('offline') >= 0)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script>
    // Installing on the home screen. Chrome offers it with an event that
    // can come before the app has loaded, so keep the offer here for the
    // app's own Install button (lib/data/app_install_web.dart).
    window.bqInstall = { prompt: null, installed: false };
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.bqInstall.prompt = event;
      window.dispatchEvent(new Event('bq-install-changed'));
    });
    window.addEventListener('appinstalled', function () {
      window.bqInstall.prompt = null;
      window.bqInstall.installed = true;
      window.dispatchEvent(new Event('bq-install-changed'));
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
