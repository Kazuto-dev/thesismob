name: CI

on:
  push:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      # Linux is case-sensitive, so a mis-cased import fails here.
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn

  sheets-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/sheets-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/sheets-proxy/package-lock.json
      - run: npm ci
      - run: npm test
