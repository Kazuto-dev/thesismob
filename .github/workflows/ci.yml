name: CI

on:
  push:
  workflow_dispatch:

jobs:
  # The Flutter web app in frontend/.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      # Linux is case-sensitive, so a mis-cased import fails here.
      - run: flutter analyze
      # Unit, widget and golden tests (goldens are generated on Linux).
      - run: flutter test
      # The same pure-Dart tests compiled to JavaScript, where integers
      # behave differently than on the VM.
      - run: flutter test --platform chrome test/data test/materials test/state test/export
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/tool/smoke/package-lock.json
      - name: Browser smoke test
        working-directory: frontend/tool/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8090 --directory ../../build/web &
          sleep 2
          BASE_URL=http://127.0.0.1:8090/ node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/build/web
          retention-days: 7

  # The Dart API in backend/, tested against a real PostgreSQL.
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bq
          POSTGRES_PASSWORD: bq
          POSTGRES_DB: bq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test -j 1
        env:
          TEST_DATABASE_URL: postgres://bq:bq@localhost:5432/bq_test

  # The Docker images from the root Dockerfile, run together the way the
  # server runs them: nginx must serve the app and reach the API.
  docker:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Settings for the test run
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci$(openssl rand -hex 12)/" .env
          sed -i "s/^SMTP_HOST=.*/SMTP_HOST=/" .env
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d --wait db backend frontend
      - name: The app and the API answer through nginx
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost/api/health && break
            sleep 2
          done
          curl -fsS http://localhost/ | grep -q 'BuildQuantify'
          curl -fsS http://localhost/api/v1/plans | grep -q '"business"'
          curl -fsS -o /dev/null http://localhost/main.dart.js
          # Pages of the app fall back to index.html.
          curl -fsS http://localhost/settings | grep -q 'BuildQuantify'
      - name: The admin tool works in the backend container
        run: docker compose exec -T backend admin stats
      - name: Logs
        if: failure()
        run: docker compose logs
