name: CI

on:
  push:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      # Linux is case-sensitive, so a mis-cased import fails here.
      - run: flutter analyze
      # Unit, widget and golden tests (goldens are generated on Linux).
      - run: flutter test
      # The same pure-Dart tests compiled to JavaScript, where integers
      # behave differently than on the VM.
      - run: flutter test --platform chrome test/data test/materials test/state test/export
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tool/smoke/package-lock.json
      - name: Browser smoke test
        working-directory: tool/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8090 --directory ../../build/web &
          sleep 2
          BASE_URL=http://127.0.0.1:8090/ node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bq
          POSTGRES_PASSWORD: bq
          POSTGRES_DB: bq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # Unit tests, and the API end to end against a real PostgreSQL.
      - run: dart test -j 1
        env:
          TEST_DATABASE_URL: postgres://bq:bq@localhost:5432/bq_test
      - name: Build the Docker image
        run: docker build -t buildquantify-api .
