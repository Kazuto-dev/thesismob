name: CI

on:
  push:
  workflow_dispatch:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      # Linux is case-sensitive, so a mis-cased import fails here.
      - run: flutter analyze
      # Unit, widget and golden tests (goldens are generated on Linux).
      - run: flutter test
      # The same pure-Dart tests compiled to JavaScript, where integers
      # behave differently than on the VM.
      - run: flutter test --platform chrome test/data test/materials test/state test/export
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tool/smoke/package-lock.json
      - name: Browser smoke test
        working-directory: tool/smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python3 -m http.server 8090 --directory ../../build/web &
          sleep 2
          BASE_URL=http://127.0.0.1:8090/ node smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

  sheets-proxy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/sheets-proxy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/sheets-proxy/package-lock.json
      - run: npm ci
      - run: npm test
